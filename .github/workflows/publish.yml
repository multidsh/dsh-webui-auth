name: publish

# Publishing is driven by a GitHub Release (or a manual dispatch).
# Requires the repository secret NPM_TOKEN: an npm Automation token that may
# publish to the @multidsh scope. Provenance needs the repo to stay public.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Publish with --dry-run (validates tarball, uploads nothing)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify manifest and syntax
        run: |
          set -euo pipefail
          node --check index.js
          node --check lib/client.js
          node --check lib/desktop-adapter.js
          node -e "const p=require('./package.json');
            if (p.name !== '@multidsh/dsh-webui-auth') { console.error('unexpected package name: '+p.name); process.exit(1); }
            if (p.publishConfig?.access !== 'public') { console.error('publishConfig.access must be public'); process.exit(1); }
            console.log('package:', p.name, p.version);"

      - name: Tag must match package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag '$tag' does not match package version '$version'"; exit 1
          fi

      - name: Publish (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish --access public --provenance --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
